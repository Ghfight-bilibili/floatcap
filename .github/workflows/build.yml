name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup toolchain
        run: bash scripts/setup.sh
      - name: Build
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FloatCap-apk
          path: dist/*.apk
